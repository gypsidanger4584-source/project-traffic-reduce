name: ptr

services:
  postgres:
    image: postgres:16-alpine
    container_name: ptr-postgres
    environment:
      POSTGRES_DB: ptr
      POSTGRES_USER: ptr
      POSTGRES_PASSWORD: ptr
    ports:
      - "5432:5432"
    volumes:
      - ptr_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptr -d ptr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ptr-redis
    ports:
      - "6379:6379"
    volumes:
      - ptr_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ptr_pg_data:
  ptr_redis_data:
