spring:
  application:
    name: ptr-orchestrator
  datasource:
    url: jdbc:postgresql://localhost:5432/ptr
    username: ptr
    password: ptr
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

ptr:
  redis-key-prefix: "ptr:"
  detectors:
    core: [D-35, D-38, D-34, D-37, B-17]
    exit-sink: [B-11, B-16]
